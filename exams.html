<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <title>Portfolio - Home</title>

    <style>
@font-face {
    font-family: 'Rajdhani';
    src: url('Rajdhani-Regular.ttf') format('truetype');
}

body {
    margin: 0;
    background-image: url(Pictures/Bg2.jpg);
    background-size: cover;
    color: #c5003c;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
}

body h2 {
    color: #55ead4;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
            #1d3bfc11 0px,
            #1d3bfc45 1px,
        transparent 1px,
        transparent 3px
    );
    z-index: 999;
}

body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background: #c5003b15;
    animation: flicker 0.15s infinite;
    z-index: 998;
}

@keyframes flicker {
    0% { opacity: 0.95; }
    50% { opacity: 1; }
    100% { opacity: 0.92; }
}

.navbar {
    background-color: #000000;
    padding: 15px 0;
    text-align: center;
    width: 100%;
    position: sticky;
    top: 0;
    border-bottom: 2px solid #880425;
    z-index: 1000;
}

.navbar a {
    color: #880425;
    text-decoration: none;
    font-weight: bold;
    margin: 0 20px;
}

.navbar a:hover {
    color: #55ead4;
}
    </style>
</head>

<body>
<div class="navbar">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="quizzes.html">Quizzes</a>
    <a href="lab.html">Laboratory</a>
    <a href="exams.html">Exams</a>
</div>

</body>
</html>
